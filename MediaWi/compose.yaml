# MediaWiki with MariaDB
#
# Access via "http://localhost:8080"
services:
  mediawiki:
    image: mediawiki
    restart: always
    ports:
      - 8080:80
    depends_on:
      - database
    volumes:
    #  - ./mediawiki_config/images:/var/www/html/images
          # After initial setup, download LocalSettings.php
          # and put it into the mediawiki_config folder
          # Then uncomment the line below: 

      - ./mediawiki_config/LocalSettings.php:/var/www/html/LocalSettings.php

  database: # <- This key defines the name of the database during setup
    image: mariadb
    restart: always
    environment:
      # @see https://phabricator.wikimedia.org/source/mediawiki/browse/master/includes/DefaultSettings.php
      MYSQL_DATABASE: my_wiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: example
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db:/var/lib/mysql

volumes:
  images:
  db:
